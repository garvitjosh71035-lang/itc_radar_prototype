# Render.com deployment configuration for PACE Prototype
# Deploy this repo to: https://dashboard.render.com/

services:
  # PostgreSQL Database (Render's managed Postgres with PostGIS)
  - type: postgres
    name: pace-database
    databaseName: pace
    user: pace
    plan: free
    region: singapore  # Closest to India
    pgMajorVersion: '15'
    ipAllowList: []
    
  # Backend API Service
  - type: web
    name: pace-backend
    environment: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
        generateValue: true
      - key: REDIS_URL
        sync: false
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
    diskMounts:
      - path: /tmp
        mountType: bind
    
  # Redis Cache
  - type: redis
    name: pace-cache
    plan: free
    region: singapore

  # Frontend Static Site
  - type: web
    name: pace-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: NODE_VERSION
        value: '18.x'
      - key: VITE_API_URL
        sync: false
        generateValue: false
    headers:
      - source: "/assets/*"
        headers:
          - key: "Cache-Control"
            value: "public, max-age=31536000, immutable"

diskMounts:
  - path: /var/lib/postgresql/data
    volumeSize: 10GB

envVarGroups:
  - name: pace-environment
    envVars:
      - key: POSTGIS_VERSION
        value: "15"
      
provisioning:
  databaseMigrations: true
